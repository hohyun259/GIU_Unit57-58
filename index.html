<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f3ee;font-family:'Noto Sans KR',sans-serif;color:#1a1a1a;min-height:100vh;padding:0}
.wrap{max-width:680px;margin:0 auto;padding:1.25rem 1rem 3rem;display:flex;flex-direction:column;gap:1rem}
.header{background:#fff;border:1px solid #e2ddd5;border-radius:14px;padding:1rem 1.25rem;display:flex;align-items:center;gap:.9rem}
.hicon{width:40px;height:40px;border-radius:10px;background:#fef3c7;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.htitle{font-size:16px;font-weight:700}
.hsub{font-size:11px;color:#888;margin-top:2px}
.score-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:#fff;border:1px solid #e2ddd5;border-radius:10px;padding:.65rem 1rem;text-align:center}
.sc-label{font-size:10px;font-family:'IBM Plex Mono',monospace;color:#888;margin-bottom:3px;letter-spacing:.04em}
.sc-val{font-size:22px;font-weight:700}
.sc-val.g{color:#16a34a}.sc-val.r{color:#dc2626}
.pbar-bg{height:4px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.pbar{height:100%;background:#16a34a;border-radius:999px;transition:width .4s;width:0%}
.pbar.w{background:#d97706}.pbar.b{background:#dc2626}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#e8e4dc;border-radius:10px;padding:3px}
.tab{padding:7px 2px;font-size:11px;font-family:'IBM Plex Mono',monospace;border:none;background:transparent;color:#666;border-radius:7px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2}
.tab .tnum{font-size:15px;line-height:1}
.tab.on{background:#fff;color:#1a1a1a;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel{display:none;flex-direction:column;gap:.9rem}.panel.on{display:flex}
.card{background:#fff;border:1px solid #e2ddd5;border-radius:14px;padding:1.1rem 1.25rem}
.clabel{font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.07em;color:#888;text-transform:uppercase;margin-bottom:.7rem}
/* rule guide */
.rule-section{margin-bottom:.25rem}
.rule-section-title{font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:.5rem;padding:.35rem .6rem;background:#fef3c7;border-radius:6px;display:inline-block}
.rule-item{display:flex;gap:.65rem;align-items:flex-start;padding:.6rem .4rem;border-bottom:1px solid #f0ece6}
.rule-item:last-child{border-bottom:none}
.rule-tag{font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:700;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.rule-txt{font-size:12.5px;color:#444;line-height:1.75}
.rule-txt code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:#f1f5f9;padding:1px 4px;border-radius:4px;color:#1a1a1a}
.ok-t{color:#16a34a;font-weight:600}.bad-t{color:#dc2626;font-weight:600;text-decoration:line-through}
.rule-note{font-size:11px;color:#888;margin-top:2px;font-style:italic}
/* examples */
.ex-grid{display:flex;flex-direction:column;gap:6px}
.ex-item{border:1px solid #e2ddd5;border-radius:9px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.ex-item:hover{border-color:#d97706}
.ex-head{display:flex;align-items:center;gap:8px;padding:.6rem .9rem;background:#faf9f7}
.ex-sent{font-size:13px;color:#1a1a1a;flex:1;font-family:'IBM Plex Mono',monospace}
.ex-arrow{font-size:12px;color:#bbb;transition:transform .2s}
.ex-body{display:none;padding:.7rem 1rem;border-top:1px solid #f0ece6;background:#fff}
.ex-body.on{display:block;animation:up .25s ease}
.rstatus{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:.65rem}
.rstatus.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.rstatus.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.rstatus.safe{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}
.rblabel{font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;color:#888;text-transform:uppercase;margin-bottom:4px}
.corrected{font-size:13px;line-height:1.6;color:#1a1a1a;padding:.5rem .75rem;background:#faf9f7;border-left:3px solid #d97706;border-radius:0 7px 7px 0;margin-bottom:.6rem}
.corrected mark{background:rgba(217,119,6,.18);color:#92400e;border-radius:3px;padding:0 2px;font-weight:600}
.explain{font-size:12px;line-height:1.8;color:#555;padding:.6rem .85rem;background:#faf9f7;border-radius:7px;border:1px solid #e2ddd5;white-space:pre-line}
.ex-rule-ref{font-size:11px;color:#aaa;font-family:'IBM Plex Mono',monospace;margin-top:.4rem}
/* input */
textarea{width:100%;border:1px solid #d1ccc4;border-radius:8px;background:#faf9f7;color:#1a1a1a;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.6;padding:.7rem 1rem;outline:none;resize:vertical;min-height:75px;transition:border-color .2s,box-shadow .2s}
textarea:focus{border-color:#92a8d1;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
textarea::placeholder{color:#bbb}
.btn-row{display:flex;justify-content:flex-end;margin-top:.65rem}
.btn{display:flex;align-items:center;gap:6px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;padding:.55rem 1.15rem;cursor:pointer;transition:all .18s}
.btn:hover{background:#333}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scanning{display:none;align-items:center;gap:7px;padding:.5rem .85rem;background:#fefce8;border:1px solid #fde68a;border-radius:8px;margin-top:.6rem}
.scanning.on{display:flex}
.dot{width:6px;height:6px;border-radius:50%;background:#d97706;animation:blink .7s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.13s}.dot:nth-child(3){animation-delay:.26s}
@keyframes blink{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
.scan-txt{font-size:12px;font-family:'IBM Plex Mono',monospace;color:#92400e}
.result-card{display:none}.result-card.on{display:block;animation:up .3s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* notes */
.note-empty{font-size:13px;color:#aaa;text-align:center;padding:2rem;line-height:1.8}
.note-item{border:1px solid #fca5a5;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;margin-bottom:6px}
.note-head{display:flex;align-items:flex-start;gap:8px;padding:.65rem 1rem;background:#fff9f9}
.note-head:hover{background:#fff3f3}
.note-num{font-size:10px;font-family:'IBM Plex Mono',monospace;color:#dc2626;background:#fee2e2;padding:2px 7px;border-radius:999px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.note-sent{font-size:13px;color:#1a1a1a;flex:1;line-height:1.5}
.note-chev{font-size:12px;color:#bbb;transition:transform .2s;flex-shrink:0;margin-top:2px}
.note-body{display:none;padding:.7rem 1rem;border-top:1px solid #fee2e2;background:#fff}
.note-body.on{display:block}
.clr-btn{margin-left:auto;font-size:11px;font-family:'IBM Plex Mono',monospace;color:#aaa;cursor:pointer;background:none;border:none;padding:0;transition:color .15s}
.clr-btn:hover{color:#dc2626}
.note-count{font-size:11px;font-family:'IBM Plex Mono',monospace;color:#dc2626;background:#fee2e2;padding:2px 8px;border-radius:999px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <div class="hicon">📚</div>
  <div>
    <div class="htitle">Grammar Guard</div>
    <div class="hsub">English Grammar in Use · Units 57–58 기말고사 문법 검사기</div>
  </div>
</div>

<div class="score-strip">
  <div class="sc"><div class="sc-label">전체 검사</div><div class="sc-val" id="s-total">0</div></div>
  <div class="sc"><div class="sc-label">정답</div><div class="sc-val g" id="s-ok">0</div></div>
  <div class="sc">
